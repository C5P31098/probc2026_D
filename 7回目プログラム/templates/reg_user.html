<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾得物管理システムログイン・登録画面</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
  <!-- ここからページのメインコンテンツ -->
  <main>
    <div class="container">
      <div class="row">
        <div class="col p-5 text-white rounded mt-3 bg-success">
          <h1 class="display-4 fst-italic">拾得物管理システムログイン・登録画面</h1>
          <hr>
          <div class="row justify-content-center">
            <div class="col-6 card m-1">
              <form>
                <div class="card-body">
                  <h5 class="card-title">ログインはこちらから</h5>
                  <hr>
                  <div class="mb-3">
                    <label for="userID" class="form-label">ユーザIDを入力</label>
                    <input type="text" class="form-control" id="userID" aria-describedby="emailHelp">
                  </div>
                  <div class="mb-3">
                    <label for="loginPassword" class="form-label">パスワードを入力</label>
                    <input type="password" class="form-control" id="loginPassword">
                  </div>
                  <button type="submit" class="btn btn-primary">ログイン</button>
                </div>
              </form>
            </div>
            <div class="col-6 card m-1">
              <form>
                <div class="card-body">
                  <h5 class="card-title">初めて利用される方はこちらからユーザ登録</h5>
                  <hr>
                  <div class="mb-3">
                    <label for="new-userID" class="form-label">新規ユーザIDを作成</label>
                    <input type="text" class="form-control" id="new-userID" aria-describedby="emailHelp">
                    <div id="new-userIDHelp" class="form-text">8文字以上</div>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">新規パスワードを作成</label>
                    <input type="new-password" class="form-control" id="exampleInputPassword1">
                    <div id="new-userIDHelp" class="form-text">英語と数字を含めて８文字以上</div>
                  </div>
                  <button type="submit" class="btn btn-primary">登録</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
  </main>
  <!-- ここまでページのメインコンテンツ -->


  <!-- ここからページ下部のフッタ部 -->
  <footer class="fixed-bottom bg-success text-light text-end">
    <div>文教大学 情報学部 情報システム学科 プロジェクト演習BC</div>
  </footer>
  <!-- ここまでページ下部のフッタ部 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>

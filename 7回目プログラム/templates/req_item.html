{% extends "base.html" %}

{% block title %}捜索依頼{% endblock %}

{% block content %}

<h2 class="text-primary fw-bold mb-4">捜索依頼画面</h2>

<div class="request-box">

    <form action="/req_item" method="POST">

        <div class="row mb-3 align-items-center">
            <label class="col-3">氏名</label>
            <div class="col-6">
                <input type="text" class="form-control" name="user_name">
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">学籍番号</label>
            <div class="col-6">
                <input type="text" class="form-control" name="user_id">
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">メールアドレス</label>
            <div class="col-6">
                <input type="email" class="form-control" name="contact">
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">電話番号</label>
            <div class="col-6">
                <input type="text" class="form-control" name="phone">
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">遺失物名</label>
            <div class="col-6">
                <input type="text" class="form-control" name="item_name">
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">分類</label>
            <div class="col-6">
                <select class="form-select" name="category">
                    <option>選択してください</option>
                    <option>貴重品</option>
                    <option>文房具</option>
                    <option>衣類</option>
                    <option>その他</option>
                </select>
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">特徴</label>
            <div class="col-6">
                <input type="text" class="form-control" name="description">
            </div>
        </div>

        <div class="row mb-3 align-items-center">
            <label class="col-3">遺失場所</label>
            <div class="col-6">
                <input type="text" class="form-control" name="lost_location">
            </div>
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-primary px-5 me-3">確認</button>
            <button type="reset" class="btn btn-secondary px-5">リセット</button>
        </div>

    </form>

</div>

<style>
.request-box{
    width: 800px;
    padding: 40px 60px;
    background: #f5f5f5;
    border: 2px solid #6da5ff;
    border-radius: 60px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}
</style>

{% endblock %}

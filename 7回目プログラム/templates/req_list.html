<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾得物管理システム</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{  
    margin:0;
    background:#f5f5f5;
}

/* ヘッダー */
.top-header{    
    height:70px;
    background:#eeeeee;
    border-bottom:2px solid #2f6ea0;
}

.top-header h1{
    margin:0;
    padding-left:20px;
    color:#2d4860;
    font-weight:bold;
}

/* サイドバー */
.sidebar{
    width:240px;
    min-height:calc(100vh - 70px);
    background:#0d4868;
}

.sidebar .nav-link{
    color:white;
    font-size:1.2rem;
    padding:18px 25px;
}

.sidebar .nav-link:hover{
    background:#156083;
}

.sidebar .active{
    background:#0a3a55;
}

.sidebar i{
    margin-right:10px;
}

/* メイン */
.content{
    padding:25px 35px;
}

.page-title{
    color:#0d4868;
    font-weight:bold;
    margin-bottom:25px;
}

/* 検索エリア */
.search-box{
    background:#dff0ff;
    border:2px solid #6ea6d8;
    border-radius:20px;
    padding:20px;
    margin-bottom:40px;
}

.search-btn{
    width:120px;
}

/* テーブル */
.table thead{
    background:#4f7eb7;
    color:white;
}

.table th{
    background:#4f7eb7 !important;
    color:white !important;
}

.detail-btn{
    padding:3px 10px;
}

</style>
</head>

<body>

<!-- ヘッダー -->
<header class="top-header d-flex align-items-center">
    <h1>拾得物管理システム</h1>
</header>

<div class="d-flex">

    <!-- サイドバー -->
    <nav class="sidebar">

        <ul class="nav flex-column">

            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-person-fill"></i>
                    ユーザ登録
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-plus-circle-fill"></i>
                    拾得物登録
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-card-list"></i>
                    拾得物一覧
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-person-badge-fill"></i>
                    届け出データ作成
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="#">
                    <i class="bi bi-file-earmark-text-fill"></i>
                    捜索依頼
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link active" href="#">
                    <i class="bi bi-person-lines-fill"></i>
                    捜索依頼一覧
                </a>
            </li>

        </ul>

    </nav>

    <!-- メイン -->
    <main class="content flex-grow-1">

        <h2 class="page-title">
            捜索依頼一覧画面
        </h2>

        <!-- 検索エリア -->
        <div class="search-box">

            <div class="row align-items-end">

                <div class="col-md-3">
                    <label class="form-label">
                        キーワード
                    </label>
                    <input
                    type="text"
                    class="form-control"
                    id="keyword">
                </div>

                <div class="col-md-3">
                    <label class="form-label">
                        分類
                    </label>
                    <select
                    class="form-select"
                    id="category">

                        <option value="">
                            全て
                        </option>

                        <option>
                            財布
                        </option>

                        <option>
                            電子
                        </option>

                        <option>
                            カード
                        </option>

                        <option>
                            その他
                        </option>

                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label">
                        日付
                    </label>
                    <input
                    type="date"
                    class="form-control"
                    id="date">
                </div>

                <div class="col-md-3">
                    <button
                    class="btn btn-primary search-btn"
                    onclick="searchData()">
                        検索
                    </button>
                </div>

            </div>

        </div>

        <h3 class="mb-3">出力例</h3>

        <table class="table table-bordered table-hover">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>遺失物名</th>
                    <th>分類</th>
                    <th>場所</th>
                    <th>状態</th>
                    <th>詳細</th>
                </tr>
            </thead>

            <tbody id="resultTable">

                <tr>
                    <td>01</td>
                    <td>財布</td>
                    <td>財布</td>
                    <td>3213</td>
                    <td>捜索中</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm detail-btn">
                            詳細
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>02</td>
                    <td>iPhone</td>
                    <td>電子</td>
                    <td>食堂</td>
                    <td>発見済</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm detail-btn">
                            詳細
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>03</td>
                    <td>学生証</td>
                    <td>カード</td>
                    <td>図書館</td>
                    <td>捜索中</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm detail-btn">
                            詳細
                        </button>
                    </td>
                </tr>

                <tr>
                    <td>04</td>
                    <td>傘</td>
                    <td>その他</td>
                    <td>体育館</td>
                    <td>発見済</td>
                    <td>
                        <button class="btn btn-outline-primary btn-sm detail-btn">
                            詳細
                        </button>
                    </td>
                </tr>

            </tbody>

        </table>

    </main>

</div>

<script>

function searchData(){

    let keyword =
        document.getElementById("keyword")
        .value
        .toLowerCase();

    let rows =
        document.querySelectorAll(
            "#resultTable tr"
        );

    rows.forEach(function(row){

        let text =
            row.innerText.toLowerCase();

        if(
            text.includes(keyword)
        ){
            row.style.display = "";
        }
        else{
            row.style.display = "none";
        }

    });

}

</script>

</body>
</html>

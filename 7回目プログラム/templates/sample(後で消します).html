<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>拾得物管理システム</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f5f5f5;
        }

        /* ヘッダー */
        .top-header {
            height: 70px;
            background: #f0f0f0;
            border-bottom: 1px solid #ccc;
        }

        .top-header h1 {
            color: #123d63;
            font-weight: bold;
            font-size: 2rem;
            margin: 0;
        }

        /* サイドバー */
        .sidebar {
            width: 220px;
            min-height: calc(100vh - 70px);
            background-color: #0c4b68;
        }

        .sidebar .nav-link {
            color: white;
            padding: 15px 20px;
            font-size: 1.1rem;
        }

        .sidebar .nav-link:hover {
            background-color: #156083;
            color: white;
        }

        .sidebar i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* メイン領域 */
        .content {
            padding: 30px;
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="top-header d-flex align-items-center px-4">
        <h1>拾得物管理システム</h1>
    </header>

    <div class="d-flex">

        <!-- サイドバー -->
        <nav class="sidebar">

            <ul class="nav flex-column mt-3">

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-person-fill"></i>
                        ユーザ登録
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-plus-circle-fill"></i>
                        拾得物登録
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-card-list"></i>
                        拾得物一覧
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-person-badge-fill"></i>
                        届け出データ作成
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-file-earmark-text-fill"></i>
                        捜索依頼
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">
                        <i class="bi bi-person-lines-fill"></i>
                        捜索依頼一覧
                    </a>
                </li>

            </ul>
        </nav>

        <!-- メイン -->
        <main class="content flex-grow-1">
            <h2>メインコンテンツ</h2>
            <p>ここに画面内容を表示します。</p>
        </main>

    </div>

</body>
</html>

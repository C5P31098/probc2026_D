{% extends "base.html" %}

{% block content %}
<main>
    <div class="container">
        <div class="row mt-3 mb-1">
            <div class="col">
                <p class="h2 p-1  bg-success w-50 rounded text-center text-white">遺失物捜索登録</p>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <p class="bg-light p-1 border m-0">遺失物捜索依頼画面では，文教大学湘南キャンパスで何か物を無くした際に，その情報を登録するための画面です．遺失物依頼を出すことで，当該の品物が拾得物として登録された際には，本人に連絡が行くようになります．</p>
                <hr>
            </div>
        </div>

        <div class="row">
            <form method="GET">
            <table>
                <tr><td>拾得物分類</td><td>
                    <select name="category">
                    {% for i in j %}
                    <option value="{{i.ID}}">{{i.大分類}} - {{i.物品名}}</option>
                    {% endfor %}
                    </select>
                </td></tr>
                <tr><td>遺失場所</td><td><input type="text" name="place"></td></tr>
                <tr><td>色</td><td><input type="text" name="color"></td></tr>
                <tr><td>特徴</td><td><input type="text" name="features"></td></tr>
                <tr><td>遺失者（ユーザ）</td><td><input type="text" name="user"></td></tr>
            </table>
            <button class="btn btn-success" type="submit">登録</button>
            </form>
        </div>
    </div>
</main>
{% endblock %}
